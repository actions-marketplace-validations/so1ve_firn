name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release-pr:
    name: Prepare release
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    uses: so1ve/workflows/.github/workflows/rust-release.yml@v1
    with:
      toolchain: nightly
      runs-on: ubuntu-24.04
      command: release-pr

  release:
    name: Publish release
    uses: so1ve/workflows/.github/workflows/rust-release.yml@v1
    with:
      toolchain: nightly
      runs-on: ubuntu-24.04
      command: release

  release-binary:
    name: Release Binary ${{ matrix.asset }}
    needs: release
    if: ${{ needs.release.outputs.releases != '' && needs.release.outputs.releases != '[]' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: firn-x86_64-linux
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - asset: firn-aarch64-linux
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
    steps:
      - uses: so1ve/workflows/setup-rust@v1
        with:
          toolchain: nightly

      - name: Checkout release tag
        run: |
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG"
          git checkout --detach FETCH_HEAD

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add musl Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Build static binary
        env:
          CC: musl-gcc
        run: |
          cargo build --locked --release --target "${{ matrix.target }}"
          mv "target/${{ matrix.target }}/release/firn" "${{ matrix.asset }}"

      - name: Upload binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "${{ matrix.asset }}" --clobber
