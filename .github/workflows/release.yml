name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    uses: so1ve/workflows/.github/workflows/release.yml@v1
    permissions:
      contents: write
      id-token: write
    with:
      publish: false

  major-tag:
    name: Update Major Tag
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move floating major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force --annotate "$major" --message "Release $TAG"
          git push origin --force "refs/tags/$major"
